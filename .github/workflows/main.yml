name: Build Android APK 25

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project structure
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/travianfarmassistant/MainActivity.kt
          test -f app/src/main/res/layout/activity_main.xml
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/values/themes.xml

      - name: Build APK 25
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/TravianFarmAssistant25-debug.apk

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/TravianFarmAssistant25-debug.apk
          ls -lh app/build/outputs/apk/debug/TravianFarmAssistant25-debug.apk

      - name: Upload APK 25
        uses: actions/upload-artifact@v4
        with:
          name: TravianFarmAssistant25-debug
          path: app/build/outputs/apk/debug/TravianFarmAssistant25-debug.apk
          if-no-files-found: error
